name: Update Bento README

on:
  schedule:
    - cron: '17 5 * * *'   # ~5:17 AM UTC daily (off-the-hour to avoid Actions load spikes)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'assets/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-bento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate bento card and update README
        env:
          GH_TOKEN: ${{ secrets.BENTO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_bento.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bento.svg README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily bento stats update"
            git push
          fi
